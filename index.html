<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- interactive-widget: no Android, o teclado encolhe a página em vez de
         cobrir o pé dela — é o que deixa a caixa de resposta das Conversas
         acima do teclado. O iPhone ignora, e já rola até o campo sozinho. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <!-- O nome do produto. O mesmo nome mora em src/lib/marca.ts: trocou aqui, troque lá. -->
    <title>CRM Odonto</title>

    <!-- INSTALAR COMO APLICATIVO ("Adicionar à tela inicial").
         Estes três apontam para a cor padrão (petróleo), e são TROCADOS em tempo
         de execução por `aplicarCorDoSistema` (src/lib/marca.ts) para a cor da
         empresa — é o que faz o ícone instalado sair na cor dela. Os arquivos
         das 7 cores moram em public/app/. -->
    <link rel="manifest" href="/app/manifest-petroleo.webmanifest" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon-petroleo.png" />
    <meta name="theme-color" content="#1E6E8C" />
    <!-- O iPhone ignora o manifesto para abrir sem a barra do Safari: pede estes. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CRM Odonto" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
